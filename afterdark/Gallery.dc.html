<script src="masul-widget.js?v=2"></script>
<script>
/* "Add to order" buttons on dish cards: open the collection order form with that dish
   already in the basket. Delegated on document so it survives the bundler rebuilding the DOM. */
document.addEventListener("click", function(e){
  var b=e.target.closest&&e.target.closest("[data-order-item]");
  if(!b)return;
  e.preventDefault();
  if(!(window.MasulForms&&window.MasulForms.open)){location.href="Menu.dc.html";return;}
  window.MasulForms.open("order",{items:[{name:b.getAttribute("data-order-item"),qty:1}]});
  setTimeout(function(){ // bring the chosen dish into view inside the form
    var row=[].filter.call(document.querySelectorAll(".mzf-item"),function(r){var q=r.querySelector(".mzf-q");return q&&q.textContent!=="0";})[0];
    if(row){row.scrollIntoView({block:"center"});row.style.background="rgba(222,180,90,.18)";}
  },60);
});
</script>
<!-- masul:end -->
